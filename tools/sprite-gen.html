<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ドット絵の作業台</title>
    <!-- 開発用（pnpm run dev で /tools/sprite-gen.html）。vite build の入口は index.html だけなので配布物には入らない -->
    <style>
      :root { --bg: #16161c; --panel: #202029; --line: #33333f; --text: #e6e6ee; --dim: #9a9aab; --accent: #e0b050; --warn: #e07860; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
      main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px; min-height: 100vh; }
      @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
      form { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; align-self: start; position: sticky; top: 16px; }
      h1 { font-size: 16px; margin: 0; }
      label { display: flex; flex-direction: column; gap: 4px; color: var(--dim); font-size: 12px; }
      .row { display: flex; gap: 8px; }
      .row > label { flex: 1; }
      .check { flex-direction: row; align-items: center; gap: 6px; }
      input, select, textarea, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; }
      textarea { resize: vertical; min-height: 60px; }
      button { cursor: pointer; }
      button.primary { background: var(--accent); color: #1a1a1a; border: none; font-weight: 600; padding: 8px; }
      button:disabled { opacity: 0.5; cursor: wait; }
      .tabs { display: flex; gap: 4px; }
      .tabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
      #status { font-size: 12px; color: var(--dim); min-height: 18px; white-space: pre-wrap; }
      #status.error { color: var(--warn); }
      #source { display: flex; gap: 8px; align-items: end; }
      canvas { image-rendering: pixelated; display: block; }
      .batch { margin-bottom: 20px; }
      .batch h2 { font-size: 12px; font-weight: normal; color: var(--dim); margin: 0 0 8px; word-break: break-word; }
      .cards { display: flex; flex-wrap: wrap; gap: 12px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
      .views { display: flex; gap: 10px; align-items: end; }
      .stage { border-radius: 4px; padding: 6px; }
      .meta { font-size: 12px; color: var(--dim); }
      .actions { display: flex; gap: 6px; flex-wrap: wrap; }
      details { font-size: 12px; }
      details pre { margin: 4px 0 0; white-space: pre-wrap; color: var(--dim); max-width: 420px; }
      summary.warn { color: var(--warn); }
      .empty { color: var(--dim); }
    </style>
  </head>
  <body>
    <main>
      <form id="form">
        <h1>ドット絵の作業台（Spriteloom）</h1>
        <div class="tabs">
          <button type="button" data-mode="generate" aria-pressed="true">新しく描く</button>
          <button type="button" data-mode="edit" aria-pressed="false">既存を描き変え</button>
        </div>
        <label><span id="subject-caption">主題（英語）</span><textarea id="subject" placeholder="skeleton knight with a rusty sword"></textarea></label>
        <div id="edit-fields" hidden>
          <div id="source">
            <label style="flex: 1">元のキー<input id="from-key" list="sprite-keys" /></label>
            <label style="width: 70px">フレーム<input id="from-frame" type="number" min="0" value="0" /></label>
            <canvas id="source-preview" width="1" height="1"></canvas>
          </div>
        </div>
        <div id="generate-fields" class="row">
          <label>見え方<select id="view"></select></label>
          <label>サイズ<input id="size" value="48" title="N か WxH" /></label>
        </div>
        <label id="extra-label">追記（任意）<input id="extra" /></label>
        <div class="row">
          <label>密度<select id="dots"><option value="1">1</option><option value="2" selected>2</option><option value="4">4</option></select></label>
          <label>案の数<input id="variants" type="number" min="1" max="8" value="4" /></label>
          <label>seed<input id="seed" type="number" placeholder="ランダム" /></label>
        </div>
        <div class="row">
          <label>背景<select id="background"></select></label>
          <label>ポート<input id="port" type="number" /></label>
        </div>
        <label class="check"><input id="free-palette" type="checkbox" />PALETTE に固定しない</label>
        <div class="row">
          <label>並べて比べるキー<input id="compare-key" list="sprite-keys" placeholder="なし" /></label>
          <label>定数名<input id="const-name" placeholder="FRAME" /></label>
        </div>
        <button id="run" class="primary" type="submit">生成（Ctrl+Enter）</button>
        <div id="status"></div>
        <datalist id="sprite-keys"></datalist>
      </form>
      <section id="results"><p class="empty">Spriteloom を起動（E:\tools\spriteloom\start-server.bat）してから生成する。</p></section>
    </main>
    <script type="module" src="/src/tools/spriteGen.ts"></script>
  </body>
</html>
