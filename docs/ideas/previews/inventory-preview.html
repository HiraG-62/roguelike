<title>持ち物画面の見本</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
:root {
  color-scheme: dark;
  /* ページの外側 */
  --page-bg: #0a090c;
  --page-panel: #141216;
  --page-line: #3a3640;
  --page-tx: #e8e2d4;
  --page-sub: #9a948a;
  --page-dim: #5c5852;
  --page-accent: #c83a2a;
  --page-focus: #fff4d0;

  /* G4 推奨: 墨染めの帳 + 漆の縁 */
  --g4-paper: #141216; --g4-fiber-a: #1c1a20; --g4-fiber-b: #100e12;
  --g4-card: #1e1b22; --g4-card2: #2a2630; --g4-rule: #3a3640;
  --g4-tx: #e8e2d4; --g4-sub: #9a948a; --g4-dim: #5c5852; --g4-ink: #141216;
  --g4-focus: #fff4d0; --g4-shu: #c83a2a; --g4-gold: #c8a050;
  --g4-fr1: #2a282c; --g4-fr2: #b0342c; --g4-fr3: #c8a050;
  --g4-gold-hi: #f0d890; --g4-gold-lo: #7a5a28;
  --g4-up: #8fd08a; --g4-down: #ff7a70;
  /* G3 墨染めの帳 */
  --g3-rule-fr: #3a3640;
  /* G2 漆の盆 */
  --g2-paper: #120a0b; --g2-fiber-a: #1c1012; --g2-fiber-b: #0a0506;
  --g2-card: #1e1113; --g2-card2: #33191c; --g2-rule: #8a6a30;
  --g2-fr1: #050304; --g2-fr2: #c0342a; --g2-fr3: #d8b060;
  /* G5 素のピクセル */
  --g5-paper: rgba(14, 16, 28, 0.88); --g5-fiber-a: rgba(20, 24, 40, 0.88); --g5-fiber-b: rgba(10, 12, 22, 0.88);
  --g5-card: #1c2034; --g5-card2: #2a3050; --g5-rule: #3c4462;
  --g5-tx: #eef0f6; --g5-sub: #a0a6b8; --g5-dim: #5a607a; --g5-ink: #0e101c;
  --g5-focus: #ffffff; --g5-accent: #8cb4ff; --g5-hi: #d8e0f0; --g5-lo: #07080f;
  /* G1 巻物 */
  --g1-paper: #e6dcc4; --g1-fiber-a: #d9cdb0; --g1-fiber-b: #efe7d4;
  --g1-card: #ddd1b4; --g1-card2: #cbbd98; --g1-rule: #9a8a6a;
  --g1-tx: #221e1a; --g1-sub: #5e5446; --g1-dim: #9a8e78;
  --g1-focus: #1a1a24; --g1-rod: #5a3a22; --g1-rod-hi: #8a6040; --g1-knob: #c8a050;
  --g1-up: #2f7a2a; --g1-down: #b8322a;
  /* 今の画面（再現） */
  --cur-paper: #0d0d14; --cur-card: #14141e; --cur-card2: #25252f; --cur-line: #4a4a58;
  --cur-tx: #d8d8e0; --cur-sub: #8a8a9a; --cur-dim: #50505e; --cur-sel: #ffd75f; --cur-help: #6ab0e8;
  --cur-warn: #ff6060;

  /* 語の色（G-3 の 5 家族） */
  --kw-act: #d8d0bc;
  --kw-melee: var(--kw-act); --kw-ranged: var(--kw-act); --kw-dash: var(--kw-act); --kw-just: var(--kw-act);
  --kw-combo: var(--kw-act); --kw-finisher: var(--kw-act); --kw-counter: var(--kw-act); --kw-still: var(--kw-act);
  --kw-placed: var(--kw-act); --kw-area: var(--kw-act); --kw-bullet: var(--kw-act); --kw-explode: var(--kw-act); --kw-wall: var(--kw-act);
  --kw-mana: #7890f0; --kw-energy: #c8a050; --kw-crit: #fff4d0;
  --kw-lowHp: #ff7a70; --kw-hurt: #ff7a70; --kw-kill: #ff7a70; --kw-stagger: #ff7a70; --kw-elite: #ff7a70;
  --kw-heal: #8fd08a; --kw-ward: #8fd08a; --kw-clear: #8fd08a; --kw-reaction: #8fd08a;
  --kw-burn: #f07038; --kw-chill: #80c8f0; --kw-shock: #e6dc50; --kw-poison: #98d048; --kw-bleed: #e0485a;
  --kw-vulnerable: #f088b8; --kw-weaken: #b898c0; --kw-fear: #b080f0; --kw-silence: #8c90f0;
  --kw-elFire: #f07038; --kw-elIce: #80c8f0; --kw-elLightning: #e6dc50; --kw-elPoison: #98d048;
  --kw-elDark: #a078e0; --kw-elLight: #f0e8c0; --kw-elNone: #c8c8c8;
  --kw-crimson: #e8553a; --kw-azure: #3a8ee8; --kw-jade: #49c46b; --kw-gold: #f2c84b; --kw-umbra: #9a5ae0; --kw-inverted: #a070e0;
  /* 今の語の色（流れタブの再現に使う） */
  --old-kw-a: #e0e0e0; --old-kw-b: #ffd75f; --old-kw-c: #ff7030; --old-kw-d: #80d0ff; --old-kw-e: #ffff60;
  --old-kw-f: #80ffd0; --old-kw-g: #ff6060; --old-kw-h: #6080ff; --old-kw-i: #ffe040; --old-kw-j: #c03030;
  /* 系譜 9 色 */
  --ln-ash: #e0582e; --ln-frost: #9fd6f0; --ln-thunder: #e6dc50; --ln-moon: #a078e0; --ln-earth: #b88a48;
  --ln-blade: #b8c0c8; --ln-cycle: #6cc08a; --ln-horde: #b04868; --ln-wealth: #e0a030;
  --ln-core: #d8d0bc; --ln-curse: #9a5ae0;
  /* 性質の分類 5 色 */
  --tr-crimson: #e8553a; --tr-azure: #3a8ee8; --tr-jade: #49c46b; --tr-gold: #f2c84b; --tr-umbra: #9a5ae0;
  /* 揺らぎ */
  --fx-sei: #b0a898; --fx-yu: #6ec3d4; --fx-ara: #f08a3c; --fx-han: #a070e0; --fx-mei: #c8a050;
  /* 章の差し色 */
  --ch-hub: #c83a2a; --ch-1: #c8e878; --ch-2: #ffb45a; --ch-3f: #ff7a2a; --ch-3i: #b8e4ff; --ch-4: #b27cff; --ch-deep: #c83a2a;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page-bg);
  color: var(--page-tx);
  font-family: 'DotGothic16', 'MS Gothic', 'Osaka-Mono', 'Noto Sans Mono CJK JP', monospace;
  font-size: 14px;
  line-height: 1.6;
}
.wrap { max-width: 1960px; margin: 0 auto; padding: 16px; }
.top h1 { font-size: 22px; font-weight: normal; margin: 0 0 4px; letter-spacing: 1px; }
.top p { margin: 0 0 12px; color: var(--page-sub); max-width: 60em; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-bottom: 10px; }
.ctl .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.ctl .lab { color: var(--page-sub); margin-right: 4px; font-size: 13px; }
.btn {
  font: inherit; font-size: 13px; color: var(--page-tx); background: var(--page-panel);
  border: 1px solid var(--page-line); padding: 3px 8px; cursor: pointer; line-height: 1.4;
}
.btn:hover { border-color: var(--page-sub); }
.btn[aria-pressed="true"] { background: var(--page-accent); border-color: var(--page-accent); color: var(--page-tx); }
.btn:focus-visible, .stage:focus-visible { outline: 2px solid var(--page-focus); outline-offset: 2px; }
.jump { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 0; align-items: center; }
.stage {
  width: 100%; overflow: hidden; background: var(--page-bg); outline: none;
  border: 1px solid var(--page-line);
}
.notes { margin-top: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.notes .card { background: var(--page-panel); border: 1px solid var(--page-line); padding: 10px 12px; }
.notes h2 { font-size: 15px; font-weight: normal; margin: 0 0 4px; color: var(--page-focus); }
.notes ul { margin: 0; padding-left: 1.2em; }
.notes li { margin: 2px 0; }
.notes .sub { color: var(--page-sub); }
.keys { color: var(--page-sub); font-size: 13px; margin-top: 8px; }
.keys b { color: var(--page-tx); font-weight: normal; border: 1px solid var(--page-line); padding: 0 4px; margin: 0 2px; }

/* ===== ゲーム画面（480x270 の論理座標。zoom で整数倍） ===== */
.screen {
  position: relative; width: 480px; height: 270px; overflow: hidden;
  font-size: 8px; line-height: 10px; letter-spacing: 0;
  image-rendering: pixelated;
  color: var(--tx); cursor: default; user-select: none; -webkit-user-select: none;
  -webkit-font-smoothing: none;
}
.screen canvas.bgc { position: absolute; left: 0; top: 0; width: 480px; height: 270px; image-rendering: pixelated; }
.screen .paper { position: absolute; inset: 0; background-color: var(--paper); background-size: 64px 64px; image-rendering: pixelated; }
.screen .frame { position: absolute; inset: 0; pointer-events: none; }
.screen .ui { position: absolute; inset: 0; }
.screen svg { display: block; shape-rendering: crispEdges; image-rendering: pixelated; }

/* 意匠ごとの色の割り当て */
.screen[data-g="g4"], .screen[data-g="g3"] {
  --paper: var(--g4-paper); --fa: var(--g4-fiber-a); --fb: var(--g4-fiber-b);
  --card: var(--g4-card); --card2: var(--g4-card2); --rule: var(--g4-rule);
  --tx: var(--g4-tx); --sub: var(--g4-sub); --dim: var(--g4-dim); --ink: var(--g4-ink);
  --focus: var(--g4-focus); --shu: var(--g4-shu); --gold: var(--g4-gold);
  --up: var(--g4-up); --down: var(--g4-down);
  --fr1: var(--g4-fr1); --fr2: var(--g4-fr2); --fr3: var(--acc, var(--g4-fr3));
  --tab-on: var(--acc-tab, var(--g4-shu)); --tab-on-tx: var(--acc-tx, var(--g4-tx)); --tab-off: var(--g4-card); --tab-off-tx: var(--g4-sub);
  --band: var(--g4-shu); --band-tx: var(--g4-tx);
}
.screen[data-g="g2"] {
  --paper: var(--g2-paper); --fa: var(--g2-fiber-a); --fb: var(--g2-fiber-b);
  --card: var(--g2-card); --card2: var(--g2-card2); --rule: var(--g2-rule);
  --tx: var(--g4-tx); --sub: var(--g4-sub); --dim: var(--g4-dim); --ink: var(--g2-paper);
  --focus: var(--g4-focus); --shu: var(--g2-fr2); --gold: var(--g2-fr3);
  --up: var(--g4-up); --down: var(--g4-down);
  --fr1: var(--g2-fr1); --fr2: var(--g2-fr2); --fr3: var(--acc, var(--g2-fr3));
  --tab-on: var(--acc-tab, var(--g2-fr2)); --tab-on-tx: var(--acc-tx, var(--g4-tx)); --tab-off: var(--g2-card); --tab-off-tx: var(--g4-sub);
  --band: var(--g2-fr2); --band-tx: var(--g4-tx);
}
.screen[data-g="g5"] {
  --paper: var(--g5-paper); --fa: var(--g5-fiber-a); --fb: var(--g5-fiber-b);
  --card: var(--g5-card); --card2: var(--g5-card2); --rule: var(--g5-rule);
  --tx: var(--g5-tx); --sub: var(--g5-sub); --dim: var(--g5-dim); --ink: var(--g5-ink);
  --focus: var(--g5-focus); --shu: var(--acc, var(--g5-accent)); --gold: var(--g5-hi);
  --up: var(--g4-up); --down: var(--g4-down);
  --fr1: var(--g5-lo); --fr2: var(--g5-hi); --fr3: var(--g5-lo);
  --tab-on: var(--acc, var(--g5-hi)); --tab-on-tx: var(--g5-ink); --tab-off: var(--g5-card); --tab-off-tx: var(--g5-sub);
  --band: var(--g5-card2); --band-tx: var(--g5-tx);
}
.screen[data-g="g1"] {
  --paper: var(--g1-paper); --fa: var(--g1-fiber-a); --fb: var(--g1-fiber-b);
  --card: var(--g1-card); --card2: var(--g1-card2); --rule: var(--g1-rule);
  --tx: var(--g1-tx); --sub: var(--g1-sub); --dim: var(--g1-dim); --ink: var(--g1-tx);
  --focus: var(--g1-focus); --shu: var(--g4-shu); --gold: var(--g1-rod);
  --up: var(--g1-up); --down: var(--g1-down);
  --fr1: var(--g1-rule); --fr2: var(--g1-paper); --fr3: var(--g1-rule);
  --tab-on: var(--acc-tab, var(--g4-shu)); --tab-on-tx: var(--acc-tx, var(--g1-paper)); --tab-off: var(--g1-card); --tab-off-tx: var(--g1-sub);
  --band: var(--g4-shu); --band-tx: var(--g1-paper);
}
.screen[data-g="g1"] { --kw-act: #a89878; --ln-core: #8a7a5a; --ln-blade: #7a8490; }
.screen[data-g="g2"] .pane { box-shadow: inset 0 0 0 1px var(--gold), inset 0 0 0 2px var(--g2-fr1); }
.screen[data-g="g2"] .pane .band { top: 2px; left: 2px; right: 2px; box-shadow: inset 0 -1px 0 0 var(--gold); }
.screen[data-g="g2"] .sec::after { background: var(--gold); opacity: 0.6; }
.screen[data-g="cur"] {
  --paper: var(--cur-paper); --fa: var(--cur-paper); --fb: var(--cur-paper);
  --card: var(--cur-card); --card2: var(--cur-card2); --rule: var(--cur-line);
  --tx: var(--cur-tx); --sub: var(--cur-sub); --dim: var(--cur-dim); --ink: var(--cur-paper);
  --focus: var(--cur-sel); --shu: var(--cur-sel); --gold: var(--cur-sel);
  --up: #60ff80; --down: var(--cur-warn);
}

/* 外枠（9-slice 相当は inset の段の影で描く。ぼかしは無し） */
.screen[data-g="g4"] .frame, .screen[data-g="g2"] .frame {
  box-shadow: inset 0 0 0 1px var(--fr1), inset 0 0 0 2px var(--fr2), inset 0 0 0 3px var(--fr3);
}
.screen[data-g="g2"] .frame {
  box-shadow: inset 0 0 0 1px var(--fr1), inset 0 0 0 3px var(--fr2), inset 0 0 0 4px var(--fr3);
}
.screen[data-g="g3"] .frame { box-shadow: inset 0 0 0 1px var(--g4-fr1), inset 0 0 0 2px var(--g3-rule-fr); }
.screen[data-g="g5"] .frame { box-shadow: inset 0 0 0 1px var(--fr1), inset 0 0 0 2px var(--fr2), inset 0 0 0 3px var(--fr3); }
.screen[data-g="g1"] .frame { box-shadow: inset 1px 0 0 0 var(--g1-rule), inset -1px 0 0 0 var(--g1-rule); }
.screen[data-g="cur"] .frame { box-shadow: inset 0 0 0 8px transparent; }
.corner { position: absolute; width: 8px; height: 8px; }
.corner.tl { left: 0; top: 0; } .corner.tr { right: 0; top: 0; transform: scaleX(-1); }
.corner.bl { left: 0; bottom: 0; transform: scaleY(-1); } .corner.br { right: 0; bottom: 0; transform: scale(-1, -1); }
.rod { position: absolute; left: 0; width: 480px; height: 3px; background: var(--g1-rod); box-shadow: inset 0 1px 0 0 var(--g1-rod-hi); }
.rod.top { top: 0; } .rod.bot { bottom: 0; }
.knob { position: absolute; width: 4px; height: 5px; background: var(--g1-knob); }

/* 箱と文字 */
.b { position: absolute; }
.t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.il { display: inline-block; vertical-align: top; }
.row { position: absolute; display: flex; align-items: flex-start; white-space: nowrap; }
.big { font-size: 12px; line-height: 12px; }
.sub { color: var(--sub); }
.dim { color: var(--dim); }
.tx { color: var(--tx); }
.up { color: var(--up); } .down { color: var(--down); }
.gap2 { margin-left: 2px; } .gap4 { margin-left: 4px; } .gap6 { margin-left: 6px; } .gap8 { margin-left: 8px; }
.wrapt { white-space: normal; word-break: normal; overflow-wrap: anywhere; line-break: strict; overflow: hidden; }

/* 区画の見出し（朱の菱 + 下に墨の罫） */
.sec { position: absolute; height: 10px; display: flex; align-items: flex-start; }
.sec .dia { margin: 2px 3px 0 0; }
.sec .st { color: var(--sub); line-height: 8px; height: 8px; }
.sec::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: 0; height: 1px; background: var(--rule); }
.sec .aside { position: absolute; right: 0; top: 0; color: var(--dim); line-height: 8px; }
.screen[data-g="g5"] .sec .dia, .screen[data-g="cur"] .sec .dia { display: none; }

/* 罫（かすれ 3 種を固定の並びで） */
.hr { position: absolute; height: 1px; background-image: repeating-linear-gradient(90deg, var(--rule) 0 23px, transparent 23px 24px, var(--rule) 24px 51px, transparent 51px 52px, var(--rule) 52px 71px, transparent 71px 72px); }
.vr { position: absolute; width: 1px; background-image: repeating-linear-gradient(180deg, var(--rule) 0 29px, transparent 29px 30px, var(--rule) 30px 61px, transparent 61px 62px); }
.screen[data-g="g2"] .hr, .screen[data-g="g2"] .vr { background-image: none; background-color: var(--rule); }

/* 頁札 */
.tabs { position: absolute; left: 10px; top: 3px; height: 13px; display: flex; gap: 2px; }
.tab { height: 13px; padding: 0 4px; font-size: 12px; line-height: 13px; background: var(--tab-off); color: var(--tab-off-tx); cursor: pointer;
  clip-path: polygon(1px 0, calc(100% - 1px) 0, 100% 1px, 100% 100%, 0 100%, 0 1px); }
.tab.on { background: var(--tab-on); color: var(--tab-on-tx); }
.screen[data-g="g2"] .tab.on { box-shadow: inset 0 1px 0 0 var(--gold); }
.screen[data-g="g3"] .tab { background: transparent; }
.screen[data-g="g3"] .tab.on { background: transparent; color: var(--tx); box-shadow: inset 0 -1px 0 0 var(--shu); padding-left: 9px; position: relative; }
.screen[data-g="g3"] .tab.on::before { content: ""; position: absolute; left: 2px; top: 4px; width: 5px; height: 5px; background: var(--shu); }
.qe { position: absolute; top: 5px; color: var(--dim); line-height: 8px; }
.money { position: absolute; right: 8px; top: 5px; display: flex; gap: 6px; line-height: 8px; color: var(--tx); align-items: flex-start; }
.money .cur { display: inline-block; width: 8px; height: 8px; font-size: 6px; }

/* 一字の印（10x10） */
.gb { display: inline-block; width: 10px; height: 10px; font-size: 8px; line-height: 10px; text-align: center; vertical-align: top; flex: none; overflow: hidden; }
.gb.s { background: var(--c); color: var(--g4-ink); }
.gb.k { box-shadow: inset 0 0 0 1px var(--c); color: var(--c); }
.gb.a { box-shadow: inset 0 0 0 1px var(--c); color: var(--c);
  background: linear-gradient(var(--c), var(--c)) 2px 2px / 2px 1px no-repeat, linear-gradient(var(--c), var(--c)) 2px 2px / 1px 2px no-repeat,
    linear-gradient(var(--c), var(--c)) right 2px bottom 2px / 2px 1px no-repeat, linear-gradient(var(--c), var(--c)) right 2px bottom 2px / 1px 2px no-repeat; }
.gb + .gb { margin-left: 1px; }
.lb { display: inline-block; color: var(--dim); margin-right: 1px; flex: none; }
.lb + .gb { margin-left: 0; }
.gb + .lb { margin-left: 3px; }
/* 札の印（新 / 愛 / が / 芽 / 誓 / 名 / 装） */
.mk { display: inline-block; width: 10px; height: 10px; font-size: 8px; line-height: 10px; text-align: center; vertical-align: top; flex: none; }
.mk.new { background: var(--shu); color: var(--g4-tx); }
.pane .band .mk.new { background: var(--g4-tx); color: var(--g4-shu); }
.mk.new.seen { background: transparent; color: var(--dim); box-shadow: inset 0 0 0 1px var(--dim); }
.mk.fav { background: var(--gold); color: var(--g4-ink); }
.mk.junk { box-shadow: inset 0 0 0 1px var(--dim); color: var(--dim); }
.mk.bud { box-shadow: inset 0 0 0 1px var(--up); color: var(--up); }
.mk.oath { box-shadow: inset 0 0 0 1px var(--tr-umbra); color: var(--tr-umbra); }
.mk.named { box-shadow: inset 0 0 0 1px var(--gold), inset 0 0 0 2px var(--paper); color: var(--gold); }
.mk.eq { box-shadow: inset 0 0 0 1px var(--sub); color: var(--sub); }
.mk + .mk { margin-left: 1px; }
.slotic { display: inline-block; width: 12px; height: 12px; line-height: 12px; text-align: center; box-shadow: inset 0 0 0 1px var(--sub); color: var(--tx); flex: none; }
.slotic.w { box-shadow: inset 0 0 0 1px var(--gold); color: var(--gold); }
/* 系譜の紋・札の枠（14x14） */
.bc { display: inline-block; width: 14px; height: 14px; line-height: 14px; text-align: center; font-size: 8px; vertical-align: top; flex: none; position: relative;
  background: var(--card); color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.bc.grace { clip-path: polygon(1px 0, 13px 0, 14px 1px, 14px 13px, 13px 14px, 1px 14px, 0 13px, 0 1px); background: var(--c); color: var(--g4-ink); }
.bc.apex { box-shadow: inset 0 0 0 1px var(--gold), inset 0 0 0 2px var(--paper), inset 0 0 0 3px var(--c); }
.bc.core { box-shadow: inset 0 0 0 2px var(--c); }
.bc.temper::after { content: ""; position: absolute; left: 3px; right: 3px; bottom: 2px; height: 1px; background: var(--c); }
.bc.cursed::before { content: ""; position: absolute; right: 1px; top: 1px; width: 2px; height: 2px; background: var(--tr-umbra); }

  rec: ['推奨（A4）: 旅装を家にして 遺物 / スキル / 祝福 の頁へ潜る 4 頁 + 語の表', ['旅装 1 枚に遺物 6・スキル 4・体・共鳴・行動 5 と加護・常時の札・状態が並ぶ。祝福・共鳴・ステータスが 1 画面に揃い、ステータスタブが要らなくなる（0 章 #2・#6）', '遺物頁は試着: 候補に焦点を当てるだけで共鳴の帯と「入れ替えると」（語・共鳴・行動・体・失う / 得る性質）が ▲▼ で動く。単一の数は出さない。Shift で装備中と横並び（#1）', '焦点 1 つと 5 動詞（決定 / 戻る / 副の長押し / 詳しく / 灯す）。確定は長押し 1 種と取り消し 1 段。語の灯で源は塗り・糧は縁取りで全頁が光る（#3）', '一字の印・8px と 12px の 2 段・一覧の名前はベース名に縮め違いは語の印・揺らぎ・余白の列で見せる。新着・愛用・がらくたの印（#4・#5）']],
  act: ['別案（A2）: 行動で割る（左 / 右 / ダッシュ / スキル / 奥義 / 体）', ['原則 11（行動ごとの係数）にそのまま沿い、「この行動を何が変えているか」（武器・加護・性質・符・読むステータス）が 1 頁で読める', '加護の枠が行動の頁にそのまま収まり、祝福の置き場は迷わない', '遺物は複数の行動にまたがって何度も出る。倉庫の整理と試着の置き場がこの構成に無い（推奨にしなかった理由）']],
};
const G_NOTES = {
  g4: 'G4 推奨: 地と罫は墨染めの帳、頁の外枠と頁札だけ漆の縁（墨 1・朱 1・金の糸 1 の 3px）と角金具。朱は「今ここ・取り返しが付かない」、金は「特別」だけ。暗い地で語・系譜の色と 8px の字が読める',
  g3: 'G3 墨染めの帳: 飾りは見出しの朱の落款と墨の罫だけ。中身の面積を削らず一番読みやすいが、枠の手触りは控えめ',
  g2: 'G2 漆の盆: 黒漆の地・朱の縁・金継ぎの罫・角金具。豪華で色が映えるが、枠と罫が主張する',
  g5: 'G5 素のピクセル 9-slice: 明るい細線の 9-slice と暗い半透明の地（止まったゲームが透ける）。安く邪魔をしないが和の手がかりが無い',
  g1: 'G1 巻物: 明るい和紙に墨。世界観は最も強いが、語の色の印と 8px の色文字が沈む（そのまま見せている）。軸は上下 3px に縮めて描いた（本来は 24px を食う）',
};
const CH_NOTE = { hub: '拠点（朱）', '1': '章 1 苔の黄緑', '2': '章 2 灯籠の暖色', '3f': '章 3 炎', '3i': '章 3 霜', '4': '章 4 燐光', deep: '最深 朱' };
function updateChrome() {
  document.querySelectorAll('[data-layout]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.layout === S.layout)));
  document.querySelectorAll('.ctl [data-g]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.g === S.g)));
  document.querySelectorAll('.ctl [data-ch]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.ch === S.ch)));
  const [title, pts] = NOTES[S.layout];
  const pageName = S.layout === 'rec' ? ` ／ 今の頁: ${{ sheet: '旅装', relic: '遺物', skill: 'スキル', boon: '祝福', words: '語の表' }[S.page]}${S.wide ? '（詳しく）' : ''}` : '';
  const design = S.layout === 'cur' ? '' : `<p class="sub" style="margin:6px 0 0">意匠: ${esc(G_NOTES[S.g])} ／ 章の差し色: ${esc(CH_NOTE[S.ch])}</p>`;
  document.getElementById('note').innerHTML = `<h2>${esc(title)}${esc(pageName)}</h2><ul>${pts.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>${design}`;
  const jump = document.getElementById('jump');
  const btns = S.layout === 'rec'
    ? [['旅装', () => gotoPage('sheet', 'r:main')], ['旅装 詳しく', () => { gotoPage('sheet', 'a:primary'); S.wide = true; render(); }], ['遺物頁で試着', () => { S.relicPart = 'main'; gotoPage('relic', 'i:s1'); }], ['装備中と並べる', () => { S.relicPart = 'main'; gotoPage('relic', 'i:s1'); S.wide = true; render(); }], ['スキル頁', () => gotoPage('skill', 'sl:0')], ['祝福頁', () => gotoPage('boon', 'g:primary:0')], ['語の表', () => gotoPage('words', 'w:burn')], [S.lit ? `灯を消す（${KW[S.lit][1]}）` : '燃焼を灯す', () => { S.lit = S.lit ? null : 'burn'; render(); flashLit(); }], ['戻る Esc', back], ['戻す Ctrl+Z', undo]]
    : S.layout === 'act' ? ACT_PAGES.map((a) => [a === 'body' ? '体' : ACT_LONG[a], () => { S.actPage = a; S.focus.act = null; render(); }]).concat([[S.lit ? '灯を消す' : '燃焼を灯す', () => { S.lit = S.lit ? null : 'burn'; render(); }]])
      : CUR_TABS.map((t, i) => [t, () => { S.curTab = i; S.focus.cur = null; render(); }]);
  jump.innerHTML = '<span class="lab" style="color:var(--page-sub);font-size:13px;margin-right:4px">移動</span>' + btns.map((b, i) => `<button class="btn" data-j="${i}">${esc(b[0])}</button>`).join('');
  jump.querySelectorAll('[data-j]').forEach((el) => { el.onclick = () => { btns[+el.dataset.j][1](); stage.focus({ preventScroll: true }); }; });
  document.getElementById('keys').innerHTML = [
    ['焦点', '矢印 / WASD・マウスのホバー'], ['決定（潜る・装備・持ち上げ / 置く）', 'Enter / Space・クリック'], ['戻る', 'Esc / Backspace'],
    ['副（外す・砕く）', 'X 長押し・右クリック長押し・操作の札を押し続ける'], ['詳しく（広げる / 並べる）', 'Shift'], ['灯す', 'F（語が複数なら押すたびに次）'],
    ['印（愛用 → がらくた → なし）', 'V'], ['頁', 'Q / E・頁札のクリック'], ['部位', 'Z / C'], ['次の新着', 'R'], ['取り消し', 'Ctrl+Z'], ['スキルのスロット', '1〜4'],
  ].map(([a, b]) => `${esc(a)} <b>${esc(b)}</b>`).join('　');
}
function fit() {
  const st = document.getElementById('stage');
  const scr = document.getElementById('screen');
  const w = st.clientWidth;
  const hMax = Math.max(270, window.innerHeight - 40);
  let z = Math.min(w / 480, hMax / 270);
  z = z >= 1 ? Math.floor(z) : z;
  scr.style.zoom = String(z);
  st.style.height = `${Math.ceil(270 * z)}px`;
  placeRing();
}
document.querySelectorAll('[data-layout]').forEach((b) => { b.onclick = () => { S.layout = b.dataset.layout; S.wide = false; S.pop = null; S.lift = null; render(); }; });
document.querySelectorAll('.ctl [data-g]').forEach((b) => { b.onclick = () => { S.g = b.dataset.g; if (S.layout === 'cur') S.layout = 'rec'; render(); }; });
document.querySelectorAll('.ctl [data-ch]').forEach((b) => { b.onclick = () => { S.ch = b.dataset.ch; render(); }; });
window.addEventListener('resize', fit);
// 前回見ていた案を覚える（見る人ごとの便利機能。失敗しても既定で動く）
try {
  const saved = JSON.parse(localStorage.getItem('inv-preview') || 'null');
  if (saved && ['cur', 'rec', 'act'].includes(saved.layout)) { S.layout = saved.layout; S.g = saved.g || S.g; S.ch = saved.ch || S.ch; }
} catch (err) { /* 保存が使えない環境では既定のまま */ }
const _render = render;
render = function () { _render(); try { localStorage.setItem('inv-preview', JSON.stringify({ layout: S.layout, g: S.g, ch: S.ch })); } catch (err) { /* 無視 */ } };
drawBackdrop();
fit();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { render(); });
</script>
