<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>決める瞬間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root {
  color-scheme: dark;
  /* ページの外側 */
  --page-bg: #0a090c; --page-panel: #141216; --page-line: #3a3640;
  --page-tx: #e8e2d4; --page-sub: #9a948a; --page-dim: #5c5852;
  --page-accent: #c83a2a; --page-focus: #fff4d0;
  /* G4 墨染めの帳 + 朱と金の漆の縁 */
  --paper: #141216; --fiber-a: #1c1a20; --fiber-b: #100e12;
  --card: #1e1b22; --card2: #2a2630; --rule: #3a3640;
  --tx: #e8e2d4; --sub: #9a948a; --dim: #5c5852; --ink: #141216;
  --focus: #fff4d0; --shu: #c83a2a; --gold: #c8a050; --gold-hi: #f0d890; --gold-lo: #7a5a28;
  --fr1: #2a282c; --fr2: #b0342c; --fr3: #c8a050;
  --up: #8fd08a; --down: #ff7a70;
  --sumi: rgba(16, 14, 18, 0.9);
  /* 系の色（core/keywords の glyph / color に合わせた見本の値） */
  --kw-act: #d8d0bc; --kw-mana: #7890f0; --kw-energy: #c8a050;
  --kw-red: #ff7a70; --kw-green: #8fd08a;
  --kw-burn: #f07038; --kw-chill: #80c8f0; --kw-shock: #e6dc50; --kw-poison: #98d048; --kw-bleed: #e0485a;
  --kw-vulnerable: #f088b8; --kw-weaken: #b898c0; --kw-dark: #9a5ae0;
  /* 系譜 */
  --ln-ash: #e0582e; --ln-frost: #9fd6f0; --ln-thunder: #e6dc50; --ln-blade: #b8c0c8;
  /* 部位の縁 */
  --sl-main: #c8a050; --sl-head: #9fb4c8; --sl-armor: #b88a48; --sl-boots: #6cc08a; --sl-ring: #f088b8; --sl-amulet: #a078e0;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page-bg); color: var(--page-tx);
  font-family: 'DotGothic16', 'Noto Sans Mono CJK JP', 'MS Gothic', monospace;
  font-size: 14px; line-height: 1.6;
}
.wrap { max-width: 1960px; margin: 0 auto; padding: 16px; }
.back { color: var(--page-sub); text-decoration: none; font-size: 13px; }
.back:hover, .back:focus-visible { color: var(--page-tx); text-decoration: underline; }
h1 { font-size: 22px; font-weight: normal; margin: 6px 0 4px; letter-spacing: 1px; }
.thought { margin: 0 0 4px; color: var(--page-focus); }
.cost { margin: 0 0 12px; color: var(--page-sub); max-width: 64em; font-size: 13px; }
.cost b { color: var(--down); font-weight: normal; }
.ctl { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.btn {
  font: inherit; font-size: 13px; color: var(--page-tx); background: var(--page-panel);
  border: 1px solid var(--page-line); padding: 3px 8px; cursor: pointer; line-height: 1.4;
}
.btn:hover { border-color: var(--page-sub); }
.btn[aria-pressed="true"] { background: var(--page-accent); border-color: var(--page-accent); }
.btn:focus-visible, .stage:focus-visible { outline: 2px solid var(--page-focus); outline-offset: 2px; }
.stage { width: 100%; overflow: hidden; background: #000; border: 1px solid var(--page-line); outline: none; }
.below { margin-top: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
@media (min-width: 1000px) { .below { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } }
.note { background: var(--page-panel); border: 1px solid var(--page-line); padding: 10px 12px; min-width: 0; }
.note h2 { font-size: 15px; font-weight: normal; margin: 0 0 4px; color: var(--page-focus); }
.note p { margin: 0 0 4px; }
.note .sub { color: var(--page-sub); font-size: 13px; }
.keys { color: var(--page-sub); font-size: 13px; margin-top: 6px; }
.keys b { color: var(--page-tx); font-weight: normal; border: 1px solid var(--page-line); padding: 0 4px; margin: 0 2px; white-space: nowrap; }
table.bud { border-collapse: collapse; width: 100%; font-size: 13px; }
table.bud th, table.bud td { border-bottom: 1px solid var(--page-line); padding: 2px 6px 2px 0; text-align: left; font-weight: normal; vertical-align: top; }
table.bud th { color: var(--page-sub); }
table.bud td.n { white-space: nowrap; }
table.bud .ok { color: var(--up); } table.bud .over { color: var(--down); }

/* ===== ゲーム画面（480x270 の論理座標。zoom で整数倍） ===== */
.screen {
  position: relative; width: 480px; height: 270px; overflow: hidden;
  font-size: 8px; line-height: 8px; color: var(--tx);
  image-rendering: pixelated; user-select: none; -webkit-user-select: none; -webkit-font-smoothing: none;
}
.screen canvas { position: absolute; left: 0; top: 0; width: 480px; height: 270px; image-rendering: pixelated; }
.screen .ui { position: absolute; inset: 0; }
.screen svg { display: block; shape-rendering: crispEdges; }
.b { position: absolute; }
/* 文字の行（数える単位）。横は切り、縦ははみ出しを許す（字の上下が欠けないように） */
.tl { position: absolute; white-space: nowrap; overflow-x: clip; overflow-y: visible; height: 8px; line-height: 8px; font-size: 8px; color: var(--tx); }
.tl.big { height: 12px; line-height: 12px; font-size: 12px; }
.tl.r { text-align: right; } .tl.c { text-align: center; }
.sub { color: var(--sub); } .dim { color: var(--dim); } .up { color: var(--up); } .down { color: var(--down); } .gold { color: var(--gold); }
/* 一字の印 */
.ic { position: relative; display: inline-block; width: 10px; height: 10px; font-size: 8px; line-height: 10px; text-align: center; vertical-align: top; flex: none; overflow: hidden; }
.ic.s { background: var(--c); color: var(--ink); }
.ic.k { box-shadow: inset 0 0 0 1px var(--c); color: var(--c); }
.ic.n { color: var(--c); }
.ic.m14 { width: 14px; height: 14px; line-height: 14px; font-size: 10px; }
.ic.m16 { width: 16px; height: 16px; line-height: 16px; font-size: 12px; }
.ic.m24 { width: 24px; height: 24px; line-height: 24px; font-size: 16px; }
.ic.ab { position: absolute; }
.ic.hollow { box-shadow: inset 0 0 0 1px var(--c); color: var(--c); background: transparent; }
.ic.dash { background: transparent; color: var(--c);
  background-image: repeating-linear-gradient(90deg, var(--c) 0 2px, transparent 2px 4px), repeating-linear-gradient(90deg, var(--c) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(180deg, var(--c) 0 2px, transparent 2px 4px), repeating-linear-gradient(180deg, var(--c) 0 2px, transparent 2px 4px);
  background-size: 100% 1px, 100% 1px, 1px 100%, 1px 100%; background-position: 0 0, 0 100%, 0 0, 100% 0; background-repeat: no-repeat; }
.lb { display: inline-block; height: 10px; line-height: 10px; color: var(--dim); margin-right: 2px; flex: none; }
.row { position: absolute; display: flex; align-items: flex-start; white-space: nowrap; height: 10px; }
.row .ic + .ic { margin-left: 1px; }
.row .gapx { width: 8px; flex: none; }
.arw { display: inline-block; width: 9px; height: 10px; line-height: 10px; text-align: center; color: var(--dim); flex: none; }
.dots { display: inline-flex; gap: 1px; margin-top: 2px; flex: none; }
.dots.big { gap: 2px; margin-top: 8px; }
/* 札（見立て） */
.card { position: absolute; background: var(--sumi); box-shadow: inset 0 0 0 1px var(--rule); }
.card .edge { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--sc, var(--gold)); }
.card.empty { background: transparent; box-shadow: none;
  background-image: repeating-linear-gradient(90deg, var(--rule) 0 2px, transparent 2px 4px), repeating-linear-gradient(90deg, var(--rule) 0 2px, transparent 2px 4px),
    repeating-linear-gradient(180deg, var(--rule) 0 2px, transparent 2px 4px), repeating-linear-gradient(180deg, var(--rule) 0 2px, transparent 2px 4px);
  background-size: 100% 1px, 100% 1px, 1px 100%, 1px 100%; background-position: 0 0, 0 100%, 0 0, 100% 0; background-repeat: no-repeat; }
.card.sel { box-shadow: inset 0 0 0 2px var(--focus); }
.card .peekrule { position: absolute; left: 6px; right: 6px; height: 1px; background: var(--rule); }
.card .choice { position: absolute; left: 0; right: 0; height: 12px; }
/* 焦点の枠（白金 2px）と朱の楔 */
.fring { position: absolute; pointer-events: none; box-shadow: inset 0 0 0 2px var(--focus); z-index: 5; }
.wedge { position: absolute; width: 3px; height: 7px; background: var(--shu); clip-path: polygon(0 0, 100% 50%, 0 100%); }
/* 足元の案内（動詞 3 つまで） */
.foot { position: absolute; left: 8px; right: 8px; top: 250px; height: 10px; display: flex; justify-content: center; gap: 12px; white-space: nowrap; color: var(--sub); }
.foot.split { justify-content: space-between; left: 24px; right: 24px; }
.foot .vb { display: flex; height: 10px; line-height: 10px; }
.kc { display: inline-block; height: 10px; padding: 0 2px; line-height: 10px; color: var(--tx); box-shadow: inset 0 0 0 1px var(--sub); margin-right: 3px; flex: none; }
.foot .tl { position: static; height: 10px; line-height: 10px; }
.hold { position: absolute; height: 2px; background: var(--gold); z-index: 6; pointer-events: none; }
/* 消える浮き文字（予算に数えない） */
.fl { position: absolute; white-space: nowrap; font-size: 8px; line-height: 10px; height: 10px; padding: 0 3px; background: var(--ink); color: var(--gold-hi); box-shadow: inset 0 0 0 1px var(--gold); z-index: 7; }
/* 外枠（G4 の漆の縁 3 段） */
.frame { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 1px var(--fr1), inset 0 0 0 2px var(--fr2), inset 0 0 0 3px var(--fr3); }
.corner { position: absolute; width: 8px; height: 8px; }
.corner.tl0 { left: 0; top: 0; } .corner.tr0 { right: 0; top: 0; transform: scaleX(-1); }
.corner.bl0 { left: 0; bottom: 0; transform: scaleY(-1); } .corner.br0 { right: 0; bottom: 0; transform: scale(-1, -1); }
.hr { position: absolute; height: 1px; background: var(--rule); }
.pt { cursor: pointer; }
.shard { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: linear-gradient(135deg, transparent 45%, var(--down) 45% 55%, transparent 55%); }
.cell { position: absolute; height: 12px; }
.cell.slotbox { box-shadow: inset 0 0 0 1px var(--rule); background: var(--card); }
.cell.emptybox { background-image: repeating-linear-gradient(90deg, var(--dim) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, var(--dim) 0 1px, transparent 1px 3px);
  background-size: 100% 1px, 100% 1px; background-position: 0 0, 0 100%; background-repeat: no-repeat; }
.cell.lifted { box-shadow: inset 0 0 0 1px var(--gold); background: var(--card2); }
.op { position: absolute; width: 28px; height: 36px; }
.op .ic { position: absolute; left: 2px; top: 0; }
.op .tl { left: 0; width: 28px; top: 27px; }
.op.off { opacity: 0.35; }
@media (prefers-reduced-motion: no-preference) {
  .lit { animation: lit 0.6s steps(2) 3; }
  .wedge { animation: breathe 1.2s steps(1) infinite; }
}
@keyframes lit { 50% { background: var(--gold-lo); } }
@keyframes breathe { 50% { transform: translateX(-1px); } }
@media (max-width: 520px) { h1 { font-size: 18px; } .btn { font-size: 12px; padding: 2px 6px; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 4 案の一覧へ</a>
  <h1>A 決める瞬間</h1>
  <p class="thought">メニューで管理しない。決めることは、それが起きた場所で、その場に要る分だけ見て決める。</p>
  <p class="cost"><b>代償</b>: ラン中は倉庫から選べない（持ち込んだ 6 つ + このランの拾い物だけ）。メニューでステータスの値・計算式を読めない（訓練場の木人で確かめる）。倉庫を一望・並び替え・絞り込みできず、特定の 1 つを探すのは遅い。</p>

  <nav class="ctl" id="ctl" aria-label="場面"></nav>

  <div class="stage" id="stage" tabindex="0" aria-label="場面の見本。クリックしてからキーで操作する">
    <div class="screen" id="screen">
      <canvas id="world" width="480" height="270"></canvas>
      <div class="ui" id="ui"></div>
    </div>
  </div>

  <section class="below">
    <div class="note">
      <h2 id="aimTitle"></h2>
      <div id="aim"></div>
      <div class="keys" id="keys"></div>
    </div>
    <div class="note">
      <h2>情報の予算（この画面を数えた値）</h2>
      <div id="budget"></div>
    </div>
  </section>
</div>

  h += fring(352 + A.op * 30 + 2, 76, 24, 24, false);
  h += tl(352, 116, 118, op.n, { align: 'c' });
  // 捧げる 1 枚（注ぎ・移し）: 同じ部位の引き出しから
  if (op.off) {
    const list = offerings(sl);
    if (list.length) {
      const o = list[A.off % list.length];
      h += `<div class="card" style="${st(330, 132, 140, 26)}--sc:var(--sl-${sl})"><div class="edge"></div><div class="b" style="left:5px;top:8px">${ic('▲', 'var(--dim)', 'n')}</div>${tl(18, 9, 104, itemName(o), {})}<div class="b" style="right:5px;top:8px">${ic('▼', 'var(--dim)', 'n')}</div></div>`;
    }
  }
  h += foot([['←→', '操作'], ['↑↓', op.off ? '捧げる遺物' : '性質'], ['決定長押し', '実行']]);
  return h;
}
function anvilKey(k) {
  const A = S.anvil;
  if (A.step === 'slot') {
    if (k === 'ArrowRight' || k === 'ArrowDown') { A.slot = (A.slot + 1) % 6; return true; }
    if (k === 'ArrowLeft' || k === 'ArrowUp') { A.slot = (A.slot + 5) % 6; return true; }
    return false;
  }
  if (k === 'Escape') { A.step = 'slot'; A.result = null; return true; }
  if (k === 'ArrowLeft') { A.op = Math.max(0, A.op - 1); A.result = null; A.off = 0; return true; }
  if (k === 'ArrowRight') { A.op = Math.min(3, A.op + 1); A.result = null; A.off = 0; return true; }
  const it = S.eq[SLOTS[A.slot]];
  if (k === 'ArrowUp' || k === 'ArrowDown') {
    A.result = null;
    if (OPS[A.op].off) A.off += k === 'ArrowDown' ? 1 : -1 + offerings(SLOTS[A.slot]).length;
    else A.aff = (A.aff + (k === 'ArrowDown' ? 1 : it.af.length - 1)) % Math.min(3, it.af.length);
    return true;
  }
  return false;
}
function anvilAct(kind) {
  const A = S.anvil;
  if (A.step === 'slot') { if (kind === 'tap') { A.step = 'op'; A.result = null; A.aff = 0; } return; }
  if (kind !== 'hold') return;
  const sl = SLOTS[A.slot], it = S.eq[sl], op = OPS[A.op];
  if (op.k === 'recall' && !it.budPast) return;
  if (op.cost) A.mei = Math.max(0, A.mei - op.cost);
  if (op.k === 'stir') {
    const d = AF[it.af[A.aff]] || it.af[A.aff];
    const v = d.v || '';
    const m = v.match(/[+-]?\d+/);
    const nv = m ? v.replace(m[0], `${m[0].startsWith('-') ? '-' : '+'}${Math.abs(+m[0]) + 4}`) : v;
    A.result = { line: A.aff, text: `${d.s} ${v} → ${nv}` };
  } else if (op.k === 'pour') {
    A.result = { line: 'new', text: `来歴 ${it.prov} → ${it.prov + 96}` };
  } else if (op.k === 'move') {
    const o = offerings(sl)[A.off % offerings(sl).length];
    if (!o) return;
    A.result = { line: 'new', text: `― → 銘 ${o.named || o.inscr}` };
  } else if (op.k === 'recall') {
    const i = it.af.indexOf(it.budPast[0]);
    A.result = { line: i >= 0 ? i : 0, text: `${AF[it.budPast[0]].s} → ${AF[it.budPast[1]].s}` };
  }
}

// ============================================================
// 場面の表
// ============================================================
const SCENES = {
  floor: {
    label: '床で拾う', draw: drawFloorScene, render: renderFloor, key: floorKey, act: floorAct,
    aim: ['床の遺物に近づくと、その上に見立て（4 行）が浮く。比べる相手は同じ部位の今の 1 つだけ。', '系の出入り（得 / 失。塗り = 源・縁 = 糧）、段が変わる共鳴（変わらなければ行ごと消える）、地金の ▲▼ だけで決める。数字は出さず、世界は止めない。'],
    keys: [['近くの物を替える', '← →'], ['拾う（倉庫へ）', 'G / Enter'], ['拾って付ける', 'G / Enter 長押し'], ['覗く（性質の全文）', 'Shift を押している間'], ['石を差す', '石の前で 1〜4'], ['交戦中（上 2 行に畳む）', 'C']],
  },
  landing: {
    label: '踊り場', draw: drawStairs, render: renderLanding, key: landingKey, act: landingAct,
    aim: ['階段を降りた直後、この階に残した決めごとがあるときだけ出る頁（拾い物 → 芽 → 符を組む。無い頁は飛ばす）。', 'ラン中に選べるのは持ち込んだ 6 つとこのランの拾い物だけ。押し出された符は消さずに「宙」で待つ。'],
    keys: [['選ぶ', '← →'], ['前の拾い物をめくる', '↑ ↓'], ['付ける⇄そのまま / 持つ・置く', 'Enter・クリック'], ['次の頁', 'Enter 長押し'], ['前の頁', 'Esc']],
  },
  bearing: {
    label: '佇まい（Tab）', draw: drawBearing, render: renderBearing, key: bearingKey, act: () => {},
    aim: ['Tab で開く唯一のメニュー。今の自分の 1 枚の絵で、何も変えられない。', '共鳴している系を指すと源（実線）と糧（点線）の持ち物へ糸が伸び、数は足元の 1 行だけ。遺物・行動・石を指すと逆向きに、その物が支える系へ糸が伸びる。'],
    keys: [['指す', '矢印・マウス'], ['閉じる / 開く', 'Tab / Esc']],
  },
  prep: {
    label: '支度の台', draw: drawGarden, render: renderPrep, key: prepKey, act: prepAct,
    aim: ['拠点の庭の 6 つの台。乗ると倉庫から引き出し 3 本（新 = 拾った順 / 合 = ほかと分け合う系が多い順 / 名 = 銘・名のある遺物・芽）の先頭 1 枚ずつが浮く。', '倉庫の一覧は持たない。比べる相手は乗っている台の遺物。芽のある台は印が立ち、乗ると先に 2 択。'],
    keys: [['札を選ぶ', '← →'], ['引き出しをめくる', '↑ ↓'], ['付ける', 'Enter 長押し'], ['砕く', 'X 長押し'], ['隣の台へ歩く', 'Q / E・台のクリック']],
  },
  home: {
    label: '持ち帰り', draw: drawPaper, render: renderHome, key: homeKey, act: homeAct,
    aim: ['ランの終わりに、このランの拾い物を 残す / 砕く で選り分ける 1 頁。倉庫が膨らむ前の入口。', '指した 1 つだけを見立てで読む。既定は全部残す（倉庫が閾値を超えたら既定を砕くにする）。'],
    keys: [['指す', '← →・クリック'], ['砕く⇄残す', 'X'], ['終える', 'Enter 長押し']],
  },
  anvil: {
    label: '金床', draw: drawForge, render: renderAnvil, key: anvilKey, act: anvilAct,
    aim: ['鍛冶場の金床に乗ると装備中の 6 部位が周りに並ぶ。部位を選ぶと遺物 1 枚と操作の印 4 つ（注ぎ / 移し / 呼び戻し / 煽り。冥響の数つき）。', '注ぎ・移しは同じ部位の引き出しから捧げる 1 枚を選ぶ。結果は変わった 1 行だけが「前 → 後」で光る。'],
    keys: [['部位 / 操作', '← →'], ['決める', 'Enter'], ['性質 / 捧げる遺物', '↑ ↓'], ['実行', 'Enter 長押し'], ['部位へ戻る', 'Esc']],
  },
};
const ORDER = ['floor', 'landing', 'bearing', 'prep', 'home', 'anvil'];

// ============================================================
// 描画・予算・入力
// ============================================================
const ui = document.getElementById('ui');
function flash(text, x, y) {
  S.flash = { text, x: Math.max(6, Math.min(474 - textW(text, 8) - 6, x)), y };
  clearTimeout(flash.t);
  flash.t = setTimeout(() => { S.flash = null; render(); }, 1300);
}
function render() {
  const sc = SCENES[S.scene];
  cx.clearRect(0, 0, 480, 270);
  sc.draw();
  let h = sc.render();
  if (S.flash) h += `<div class="fl" style="left:${S.flash.x}px;top:${S.flash.y}px">${esc(S.flash.text)}</div>`;
  h += '<div class="hold" id="holdbar" style="display:none"></div>';
  ui.innerHTML = h;
  bindPointers();
  renderNotes();
}
function countBudget() {
  // 文字の行: .tl 1 つを 1 行（右に添える札 .pair は同じ行）。足元の案内は 1 行と数える
  const tls = [...ui.querySelectorAll('.tl')].filter((e) => e.textContent.trim() && !e.closest('.fl'));
  const own = tls.filter((e) => !e.classList.contains('pair') && !e.closest('.foot'));
  const hasFoot = !!ui.querySelector('.foot');
  const glyphs = ui.querySelectorAll('.ic').length;
  const cands = ui.querySelectorAll('.card.cand').length;
  const verbs = ui.querySelectorAll('.foot .vb').length;
  let nums = 0;
  for (const e of tls) { if (e.closest('.foot')) continue; nums += (e.textContent.match(/\d+/g) || []).length; }
  const maxChars = Math.max(0, ...tls.map((e) => [...e.textContent.replace(/\s+/g, '')].length));
  return { lines: own.length + (hasFoot ? 1 : 0), body: own.filter((e) => e.classList.contains('big')).length, glyphs, cands, nums, verbs, maxChars };
}
const PLAN = {
  floor: '文字 3 行（名・地金・案内）、印 ≤ 10、数字 0',
  landing: '見出し + 札 3 + めくり + 案内。符を組むで文字 12 行ちょうど',
  bearing: '印 22、文字 2 行、数字 2',
  prep: '札 3 + 引き出しの札。数字 6 のうち 3',
  home: '印の列 ≤ 17 + 指した 1 つの見立て',
  anvil: '遺物 1 枚 + 操作の印 4（残響の数つき）',
};
function renderNotes() {
  const sc = SCENES[S.scene];
  document.getElementById('aimTitle').textContent = `${sc.label} の狙い`;
  document.getElementById('aim').innerHTML = sc.aim.map((a) => `<p>${esc(a)}</p>`).join('');
  document.getElementById('keys').innerHTML = sc.keys.map(([a, b]) => `${esc(a)} <b>${esc(b)}</b>`).join('　');
  const c = countBudget();
  const row = (name, v, lim, unit) => `<tr><th>${esc(name)}</th><td class="n ${v > lim ? 'over' : 'ok'}">${v}${unit || ''}</td><td class="n sub">上限 ${lim}</td></tr>`;
  document.getElementById('budget').innerHTML = `<table class="bud">${[
    row('文字の行', c.lines, LIMIT.lines, ' 行'), row('うち BODY 12px', c.body, LIMIT.body, ' 行'), row('一字の印', c.glyphs, LIMIT.glyphs, ' 個'),
    row('並ぶ札', c.cands, LIMIT.cands, ' 枚'), row('数字', c.nums, LIMIT.nums, ' 個'), row('案内の動詞', c.verbs, LIMIT.verbs, ' つ'), row('最長の行', c.maxChars, LIMIT.chars, ' 字'),
  ].join('')}</table><p class="sub" style="margin-top:6px">案の文書の見積もり: ${esc(PLAN[S.scene])}。値は今の画面の DOM を数えたもの（浮き文字は数えない。操作すると変わる）。</p>`;
}
function bindPointers() {
  ui.querySelectorAll('[data-pt]').forEach((el) => {
    const id = el.dataset.pt;
    el.addEventListener('mouseenter', () => { if (S.scene === 'bearing' && S.bearing.focus !== id) { S.bearing.focus = id; render(); } });
    el.addEventListener('mousedown', (ev) => { ev.preventDefault(); stage.focus({ preventScroll: true }); pointTo(id); startHold('Enter', ev.button === 2 ? 'x' : 'enter'); });
  });
}
function pointTo(id) {
  const [kind, a, b] = id.split(':');
  if (kind === 'lc') S.landing.sel = +a;
  if (kind === 'rc') { S.landing.rune.col = +a; S.landing.rune.row = +b; }
  if (kind === 'rs') S.landing.rune.row = -1;
  if (kind === 'pc') { if (SLOTS[S.prep.stand] === 'amulet' && S.eq.amulet.bud && !S.prep.budDone) S.prep.budSel = +a; else S.prep.sel = +a; }
  if (kind === 'stand') { S.prep.stand = +a; S.prep.flip = [0, 0, 0]; }
  if (kind === 'hp') S.home.sel = +a;
  if (kind === 'av') { S.anvil.slot = +a; }
  if (kind === 'op') { S.anvil.op = +a; S.anvil.result = null; S.anvil.off = 0; }
  render();
}
// 長押し: 0.5 秒で hold、それより早く離すと tap
let hold = null;
function startHold(key, mode) {
  if (hold) return;
  hold = { key, mode, t0: performance.now(), fired: false };
  requestAnimationFrame(tickHold);
}
function tickHold() {
  if (!hold) return;
  const bar = document.getElementById('holdbar');
  const p = Math.min(1, (performance.now() - hold.t0) / HOLD_MS);
  if (bar) { bar.style.display = 'block'; bar.style.left = '190px'; bar.style.top = '264px'; bar.style.width = `${Math.round(100 * p)}px`; }
  if (p >= 1 && !hold.fired) { hold.fired = true; SCENES[S.scene].act(hold.mode === 'x' ? 'xhold' : 'hold'); render(); return; }
  if (!hold.fired) requestAnimationFrame(tickHold);
}
function endHold() {
  if (!hold) return;
  const h = hold; hold = null;
  if (!h.fired) { SCENES[S.scene].act(h.mode === 'x' ? 'xtap' : 'tap'); }
  render();
}
const stage = document.getElementById('stage');
stage.addEventListener('keydown', (ev) => {
  const k = ev.key;
  if (k === 'Tab' && S.scene !== 'bearing') return;
  if (k === 'Shift') { if (S.scene === 'floor' && !S.floor.peek) { S.floor.peek = true; render(); } return; }
  if (/^[1-4]$/.test(k) && S.scene === 'floor') { floorSlot(+k - 1); render(); ev.preventDefault(); return; }
  if (k === 'Enter' || k === ' ' || k === 'g' || k === 'G') { ev.preventDefault(); if (!ev.repeat) startHold(k, 'enter'); return; }
  if ((k === 'x' || k === 'X') && S.scene === 'prep') { ev.preventDefault(); if (!ev.repeat) startHold(k, 'x'); return; }
  if (SCENES[S.scene].key(k)) { ev.preventDefault(); render(); }
});
stage.addEventListener('keyup', (ev) => {
  if (ev.key === 'Shift' && S.floor.peek) { S.floor.peek = false; render(); return; }
  if (hold && (ev.key === hold.key || ev.key.toLowerCase() === String(hold.key).toLowerCase())) endHold();
});
window.addEventListener('mouseup', () => { if (hold) endHold(); });
stage.addEventListener('contextmenu', (ev) => ev.preventDefault());
stage.addEventListener('mousedown', () => stage.focus({ preventScroll: true }));
stage.addEventListener('blur', () => { if (S.floor.peek) { S.floor.peek = false; render(); } });

// 場面のボタン
const ctl = document.getElementById('ctl');
ctl.innerHTML = ORDER.map((k, i) => `<button class="btn" data-s="${k}">${i + 1}. ${esc(SCENES[k].label)}</button>`).join('');
function setScene(k) {
  S.scene = k; S.flash = null; hold = null;
  ctl.querySelectorAll('[data-s]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.s === k)));
  try { localStorage.setItem('inv2-A-scene', k); } catch (err) { /* 保存できない環境では覚えない */ }
  render();
}
ctl.querySelectorAll('[data-s]').forEach((b) => { b.onclick = () => { setScene(b.dataset.s); stage.focus({ preventScroll: true }); }; });

function fitStage() {
  const scr = document.getElementById('screen');
  const w = stage.clientWidth;
  const hMax = Math.max(270, window.innerHeight - 60);
  let z = Math.min(w / 480, hMax / 270);
  z = z >= 1 ? Math.floor(z) : z;
  scr.style.zoom = String(z);
  stage.style.height = `${Math.ceil(270 * z)}px`;
}
window.addEventListener("resize", fitStage);
let first = 'floor';
try { const v = localStorage.getItem('inv2-A-scene'); if (v && SCENES[v]) first = v; } catch (err) { /* 既定のまま */ }
const qs = new URLSearchParams(location.search).get('scene');
if (qs && SCENES[qs]) first = qs;
fitStage();
setScene(first);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
</script>
</body>
