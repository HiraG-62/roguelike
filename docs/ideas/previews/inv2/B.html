function itemKw(it) {
  const p = new Set(), co = new Set(), am = new Set();
  (it.af || []).forEach((a) => { (a.p || []).forEach((k) => p.add(k)); (a.co || []).forEach((k) => co.add(k)); (a.am || []).forEach((k) => am.add(k)); });
  if (it.kw) { (it.kw.p || []).forEach((k) => p.add(k)); (it.kw.co || []).forEach((k) => co.add(k)); (it.kw.am || []).forEach((k) => am.add(k)); }
  return { p: [...p], co: [...co], am: [...am] };
}
function contribs(eq) {
  const out = [];
  SLOTS.forEach((sl) => { const it = ITEM[eq[sl]]; if (it) out.push({ name: it.named || it.base, obj: `r:${sl}`, back: false, ...itemKw(it) }); });
  SKILL_SLOTS.forEach((s) => { const st = STONES[s.st]; if (st) out.push({ name: st.n, obj: 'inro', back: false, p: st.p || [], co: st.co || [], am: [] }); });
  BOONS.forEach((b) => out.push({ name: b.n, obj: b.card === 'core' ? 'core' : `crest:${b.ln}`, back: true, p: b.p || [], co: b.co || [], am: b.am || [] }));
  out.push({ name: `${FORM.n}の型`, obj: 'face', back: false, p: FORM.p, co: FORM.co, am: [] });
  return out;
}
function resonance(eq) {
  const cs = contribs(eq);
  const m = {};
  KW_ORDER.forEach((k) => {
    const src = cs.filter((c) => c.p.includes(k));
    const sink = cs.filter((c) => c.co.includes(k));
    const am = cs.filter((c) => c.am.includes(k)).length;
    const total = src.length + sink.length;
    let tier = 0;
    if (src.length >= RES.minSrc && sink.length >= RES.minSink) tier = 1 + Math.floor((total - RES.minSrc - RES.minSink) / RES.every) + am;
    tier = Math.min(RES.max, tier);
    const slack = tier === 0 && ((src.length === 1 && sink.length >= 2) || (sink.length === 1 && src.length >= 2));
    m[k] = { k, src, sink, am, total, tier, slack };
  });
  return m;
}
function cordList(base, prev) {
  // 共鳴中は 4 本まで、緩み（あと 1 つ）は 2 本まで。並びは今の装備の順を保つ
  const pick = (r) => {
    const on = KW_ORDER.filter((k) => r[k].tier > 0).sort((a, b) => r[b].tier - r[a].tier).slice(0, 4);
    const sl = KW_ORDER.filter((k) => r[k].slack).slice(0, 2);
    return [...on, ...sl];
  };
  const a = pick(base);
  if (!prev) return a;
  const b = pick(prev);
  const out = a.slice();
  b.forEach((k) => { if (!out.includes(k)) out.push(k); });
  return out.slice(0, 6);
}

  if (tagGeom && x >= tagGeom.x && x <= tagGeom.x + tagGeom.w && y >= tagGeom.y && y <= tagGeom.y + 80) return;
  const o = nearest(x, y);
  if (o && o.id !== S.focus) { S.focus = o.id; S.flipped = false; if (o.id.startsWith('crest:')) S.cardIdx = 0; dirty = true; }
});
stage.addEventListener('mousedown', (e) => {
  stage.focus();
  const [x, y] = toLogical(e);
  const o = nearest(x, y);
  if (S.view === 'floor' && S.floorPhase === 'floor') { if (o) S.holdStart = performance.now(); return; }
  if (!o) return;
  if (o.id === S.focus) decide(); else { S.focus = o.id; S.flipped = false; dirty = true; }
});
window.addEventListener('mouseup', () => { if (S.holdStart) { S.holdStart = 0; dirty = true; } });
stage.addEventListener('contextmenu', (e) => { e.preventDefault(); backKey(); });

// ============================================================
// 画面の外（場面の切り替え・ボタン・狙い）
// ============================================================
function renderChrome() {
  const nav = document.getElementById('scenes');
  nav.innerHTML = SCENES.map((s) => `<button class="btn" data-s="${s.k}" aria-pressed="${s.k === S.scene}">${s.k} ${esc(s.n)}</button>`).join('');
  nav.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { setScene(+b.dataset.s); stage.focus(); }));
  const sc = SCENES[S.scene - 1];
  document.getElementById('aim').innerHTML = `<h2>${sc.k}. ${esc(sc.n)}</h2>${sc.aim.map((a) => `<p>${esc(a)}</p>`).join('')}<div class="keys">${sc.keys.map(([k, l]) => `<b>${esc(k)}</b>${esc(l)}`).join('　')}　<b>1〜5</b>場面</div>`;
}
function renderPad() {
  const pad = document.getElementById('pad');
  const bs = [['←', () => move(-1, 0)], ['↑', () => move(0, -1)], ['↓', () => move(0, 1)], ['→', () => move(1, 0)], ['決定', () => { if (S.view === 'floor' && S.floorPhase === 'floor') openTrial(); else decide(); }], ['戻る', backKey], ['めくる', flipTag], ['振り向く', turnAround]];
  pad.innerHTML = bs.map(([l], i) => `<button class="btn" data-i="${i}">${esc(l)}</button>`).join('');
  pad.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { bs[+b.dataset.i][1](); }));
}
function layout() {
  const sw = document.getElementById('stageWrap');
  const avail = sw.clientWidth;
  let s = avail >= 480 ? Math.floor(avail / 480) : avail / 480;
  s = Math.min(s, 3);
  scale = s;
  stage.style.width = `${480 * s}px`; stage.style.height = `${270 * s}px`;
  cv.style.width = `${480 * s}px`; cv.style.height = `${270 * s}px`;
  ui.style.transform = `scale(${s})`;
}
window.addEventListener('resize', layout);

let lastFrame = 0;
function loop(t) {
  requestAnimationFrame(loop);
  if (dirty) { renderUI(); dirty = false; }
  if (t - lastFrame < 33) return;
  lastFrame = t;
  draw(t);
  renderBudget();
}
renderPad();
layout();
setScene(1);
requestAnimationFrame(loop);
</script>
</body>
