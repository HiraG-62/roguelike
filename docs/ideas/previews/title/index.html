<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>題字と門の見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Yuji+Boku&display=swap">
<style>
/* 配置: 上に案と名前の切り替え、中央に 480x270 の論理画面（整数倍）、下に案ごとの狙いと損。ゲームと同じ墨・朱・金の一色の見た目で固定する */
:root {
  color-scheme: dark;
  --page-bg: #0a090c;
  --panel: #141216;
  --line: #3a3640;
  --tx: #e8e2d4;
  --sub: #9a948a;
  --shu: #c83a2a;
  --gold: #c8a050;
  --focus: #fff4d0;
  --down: #ff7a70;
  --font-dot: "DotGothic16", "MS Gothic", "Osaka-Mono", "Noto Sans Mono CJK JP", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page-bg);
  color: var(--tx);
  font-family: var(--font-dot);
  font-size: 14px;
  line-height: 1.6;
  overflow-x: hidden;
}
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 32px; }
h1 { font-size: 20px; font-weight: normal; margin: 4px 0 2px; letter-spacing: 1px; text-wrap: balance; }
.lead { margin: 0 0 10px; color: var(--sub); max-width: 62em; }
.ctl { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; align-items: center; }
.ctl .lbl { color: var(--sub); font-size: 13px; min-width: 4em; }
.btn {
  font: inherit; font-size: 13px; color: var(--tx); background: var(--panel);
  border: 1px solid var(--line); padding: 3px 8px; cursor: pointer; line-height: 1.4; border-radius: 0;
}
.btn:hover { border-color: var(--sub); }
.btn[aria-pressed="true"] { background: var(--shu); border-color: var(--shu); }
.btn .rec { color: var(--gold); }
.btn[aria-pressed="true"] .rec { color: var(--focus); }
.btn:focus-visible, .stage:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.stage { outline: none; border: 1px solid var(--line); background: #000; display: block; max-width: 100%; margin-top: 8px; width: fit-content; }
#cv { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: default; max-width: 100%; }
#cv.smooth { image-rendering: auto; }
.keys { color: var(--sub); font-size: 13px; margin: 6px 0 0; }
.keys b { color: var(--tx); font-weight: normal; border: 1px solid var(--line); padding: 0 4px; margin: 0 2px; }
.notes { margin-top: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; max-width: 1000px; }
@media (min-width: 900px) { .notes { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; min-width: 0; }
.card h2 { font-size: 15px; font-weight: normal; margin: 0 0 4px; color: var(--focus); }
.card p { margin: 0 0 4px; overflow-wrap: anywhere; }
.card .cost { color: var(--sub); }
.card .cost b { color: var(--down); font-weight: normal; }
.card dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; }
.card dt { color: var(--gold); }
.card dd { margin: 0; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>タイトル画面の見本（4 案 × 名前の候補）</h1>
  <p class="lead">480x270 の論理画面を整数倍で拡大しています。待機のアニメ・メニューの選択・開始の演出が動きます。題字は下の「名前」で切り替えられ、★ は推奨の 3 つです。「記録」を「初回」にすると、記録が 1 つも無いときの見え方になります。</p>

  <div class="ctl" role="group" aria-label="案">
    <span class="lbl">案</span>
    <button class="btn" data-plan="A">A 門</button>
    <button class="btn" data-plan="B">B 絵巻</button>
    <button class="btn" data-plan="C">C 墓標の間</button>
    <button class="btn" data-plan="D">D 拠点が題字</button>
    <button class="btn" id="btnRestart">最初から</button>
  </div>
  <div class="ctl" role="group" aria-label="名前" id="names">
    <span class="lbl">名前</span>
  </div>
  <div class="ctl" role="group" aria-label="字形と記録">
    <span class="lbl">字形</span>
    <button class="btn" data-style="auto">案の既定</button>
    <button class="btn" data-style="dot">ドット</button>
    <button class="btn" data-style="brush">墨書き</button>
    <span class="lbl" style="margin-left:10px">記録</span>
    <button class="btn" data-rec="1">15 回の探索</button>
    <button class="btn" data-rec="0">初回</button>
  </div>

  <div class="stage" id="stage" tabindex="0" aria-label="タイトル画面の見本。矢印キー・Enter・Esc・マウスで操作">
    <canvas id="cv" width="1920" height="1080"></canvas>
  </div>
  <p class="keys" id="keys"></p>

  <div class="notes">
    <div class="card" id="planCard"></div>
    <div class="card" id="nameCard"></div>
  </div>
</div>

<script>
'use strict';
// ============================================================
// 色
// ============================================================
const C = {
  sumi: '#0a090c', sumi2: '#141216', card: '#1e1b22', rule: '#3a3640', tx: '#e8e2d4', sub: '#9a948a', dim: '#5c5852',
  shu: '#c83a2a', shuHi: '#e0583e', shuLo: '#8a2018', gold: '#c8a050', goldHi: '#f0d890', goldLo: '#7a5a28',
  focus: '#fff4d0', k: '#14121a',
};
const PAL = {
  lacquer: { shadow: '#000000', edge: '#2a0c08', top: '#f08a6a', hi: '#e05038', mid: '#c83a2a', lo: '#9a281c', shine: '#f0d890' },
  gold: { shadow: '#000000', edge: '#3a2c18', top: '#fff0c0', hi: '#e0c070', mid: '#c8a050', lo: '#9a7434', shine: '#ffffff' },
  paper: { shadow: '#050407', edge: null, top: '#fff4d0', hi: '#ece4d2', mid: '#dcd2bc', lo: '#b8ae98', shine: '#ffffff' },
  ink: { shadow: null, edge: null, top: '#2e2a26', hi: '#1e1b18', mid: '#171512', lo: '#100e0c', shine: null },
};
const CHAPTERS = [
  { name: '苔の洞', tint: '#c8e878', from: 1 },
  { name: '地下寺院', tint: '#ffb45a', from: 6 },
  { name: '廃城', tint: '#ff7a2a', from: 11 },
  { name: '深みの異界', tint: '#b27cff', from: 16 },
  { name: '最深の間', tint: '#f0ece0', from: 21 },
];
function chapterOf(d) { if (d <= 5) return 0; if (d <= 10) return 1; if (d <= 15) return 2; if (d <= 20) return 3; if (d === 21) return 4; return 3; }

function rgb(h) { const s = h.replace('#', ''); return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)]; }
const mixCache = new Map();
function mix(a, b, t) {
  const key = a + b + t.toFixed(3);
  let v = mixCache.get(key);
  if (v) return v;
  const A = rgb(a), B = rgb(b);
  v = '#' + A.map((x, i) => Math.round(x + (B[i] - x) * t).toString(16).padStart(2, '0')).join('');
  if (mixCache.size > 5000) mixCache.clear();
  mixCache.set(key, v);
  return v;
}
function hh(x, y, s) {
  let h = Math.imul((x | 0) ^ Math.imul((y | 0), 0x27d4eb2d) ^ Math.imul((s | 0) + 7, 0x165667b1), 0x85ebca6b);
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeIn = (t) => Math.pow(clamp(t, 0, 1), 2.2);
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)');

// ============================================================
// 画面（論理 480x270 を S 倍の裏画面へ描き、表示の canvas へ写す）
// ============================================================
const W = 480, H = 270;
const cv = document.getElementById('cv');
const mainCtx = cv.getContext('2d');
const buf = document.createElement('canvas');
let S = 4;
let G = buf.getContext('2d');
const layers = new Map();

function begin(ctx) { G = ctx; G.setTransform(S, 0, 0, S, 0, 0); G.imageSmoothingEnabled = false; G.globalAlpha = 1; }
function R(x, y, w, h, c) { G.fillStyle = c; G.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function Rf(x, y, w, h, c) { G.fillStyle = c; G.fillRect(x, y, w, h); }
function A(a) { G.globalAlpha = a; }
function disc(cx, cy, r, c) {
  if (r <= 0) return;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy + r * 0.6));
    R(cx - w, cy + dy, w * 2 + 1, 1, c);
  }
}
function ellipse(cx, cy, rx, ry, c) {
  for (let dy = -ry; dy <= ry; dy++) {
    const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry + 0.5))));
    R(cx - w, cy + dy, w * 2 + 1, 1, c);
  }
}
/** 段のある光（ディザを使わず 4 段の輪を重ねる） */
function glow(cx, cy, r, color, a) {
  const bands = [1, 0.72, 0.5, 0.3];
  bands.forEach((f, i) => { A(a * (0.09 + i * 0.06)); disc(cx, cy, Math.round(r * f), color); });
  A(1);
}
function layer(key, w, h, fn) {
  let c = layers.get(key);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = w * S; c.height = h * S;
  const prev = G;
  begin(c.getContext('2d'));
  fn();
  G = prev;
  layers.set(key, c);
  return c;
}
function blit(c, x, y) { G.save(); G.setTransform(1, 0, 0, 1, 0, 0); G.drawImage(c, Math.round(x * S), Math.round(y * S)); G.restore(); }
function spr(map, pal, x, y, sc, flip) {
  const w = map[0].length;
  for (let j = 0; j < map.length; j++) {
    const row = map[j];
    for (let i = 0; i < w; i++) {
      const c = pal[row[i]];
      if (!c) continue;
      const ii = flip ? w - 1 - i : i;
      G.fillStyle = c; G.fillRect(x + ii * sc, y + j * sc, sc, sc);
    }
  }
}

// ============================================================
// ドット文字（ゲームの pixelText と同じ: DotGothic16 を 16px でラスタライズして二値化し、整数倍で置く）
// ============================================================
const DOT = '"DotGothic16"';
const BRUSH = '"Yuji Boku"';
const textCache = new Map();
function glyphs(str, color) {
  const key = color + '\u0000' + str;
  let e = textCache.get(key);
  if (e) return e;
  const c = document.createElement('canvas');
  const g = c.getContext('2d');
  g.font = `16px ${DOT}, monospace`;
  const w = Math.max(1, Math.ceil(g.measureText(str).width));
  c.width = w; c.height = 18;
  g.font = `16px ${DOT}, monospace`;
  g.textBaseline = 'top';
  g.fillStyle = '#fff';
  g.fillText(str, 0, 1);
  const id = g.getImageData(0, 0, w, 18);
  const [r, gg, b] = rgb(color);
  for (let i = 0; i < id.data.length; i += 4) {
    const on = id.data[i + 3] >= 128;
    id.data[i] = r; id.data[i + 1] = gg; id.data[i + 2] = b; id.data[i + 3] = on ? 255 : 0;
  }
  g.putImageData(id, 0, 0);
  e = { c, w };
  if (textCache.size > 3000) textCache.clear();
  textCache.set(key, e);
  return e;
}
function dotM(size) { return Math.max(1, Math.ceil((size * S) / 16 - 1e-6)); }
/** 文字を描いて論理幅を返す。y は行の上端（base='middle' で中心） */
function T(str, x, y, size, color, align, base, alpha) {
  if (!str) return 0;
  const e = glyphs(str, color);
  const m = dotM(size);
  const dw = e.w * m, dh = 18 * m;
  let dx = x * S;
  if (align === 'center') dx -= dw / 2; else if (align === 'right') dx -= dw;
  let dy = y * S;
  if (base === 'middle') dy -= 9 * m; else if (base === 'bottom') dy -= 17 * m;
  G.save(); G.setTransform(1, 0, 0, 1, 0, 0); G.imageSmoothingEnabled = false;
  if (alpha !== undefined) G.globalAlpha *= alpha;
  G.drawImage(e.c, Math.round(dx), Math.round(dy), dw, dh);
  G.restore();
  return dw / S;
}
function TW(str, size) { return (glyphs(str, '#ffffff').w * dotM(size)) / S; }
function TS(str, x, y, size, color, shadow, align, base, alpha) { T(str, x + 1, y + 1, size, shadow, align, base, alpha); return T(str, x, y, size, color, align, base, alpha); }
/** 縦書き（1 字ずつ積む） */
function TV(str, x, y, size, color, step) {
  const st = step || size + 1;
  [...str].forEach((ch, i) => { if (ch !== ' ' && ch !== '　') T(ch, x, y + i * st, size, color, 'center'); });
}
/** 字間を空けた英字 */
function TL(str, x, y, size, color, gap, align) {
  const chars = [...str];
  const widths = chars.map((ch) => TW(ch, size));
  const total = widths.reduce((a, b) => a + b, 0) + gap * (chars.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  chars.forEach((ch, i) => { T(ch, cx, y, size, color); cx += widths[i] + gap; });
  return total;
}
function wrapText(str, maxW, size) {
  const out = [];
  let cur = '';
  for (const ch of str) {
    if (cur && TW(cur + ch, size) > maxW) { out.push(cur); cur = ch; } else cur += ch;
  }
  if (cur) out.push(cur);
  return out;
}

// ============================================================
// 題字（字の形を二値の点にして、漆・金・墨で塗る。見本なので pixelText の制約は受けない）
// ============================================================
const maskCache = new Map();
function mask(text, family, px, thr) {
  const key = family + px + '|' + thr + '|' + text;
  let M = maskCache.get(key);
  if (M) return M;
  const c = document.createElement('canvas');
  const g = c.getContext('2d');
  g.font = `${px}px ${family}, serif`;
  const w = Math.ceil(g.measureText(text).width) + px;
  const h = Math.ceil(px * 1.6);
  c.width = w; c.height = h;
  g.font = `${px}px ${family}, serif`;
  g.textBaseline = 'middle';
  g.fillStyle = '#fff';
  g.fillText(text, Math.round(px / 2), Math.round(h / 2));
  const d = g.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] >= thr) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  if (x1 < 0) { M = { w: 1, h: 1, a: new Uint8Array(1) }; maskCache.set(key, M); return M; }
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  const a = new Uint8Array(bw * bh);
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) a[y * bw + x] = d[((y + y0) * w + x + x0) * 4 + 3] >= thr ? 1 : 0;
  M = { w: bw, h: bh, a };
  maskCache.set(key, M);
  return M;
}
function boldMask(M) {
  if (M.bold) return M.bold;
  const w = M.w + 1, a = new Uint8Array(w * M.h);
  for (let j = 0; j < M.h; j++) for (let i = 0; i < w; i++) a[j * w + i] = (i < M.w && M.a[j * M.w + i]) || (i > 0 && M.a[j * M.w + i - 1]) ? 1 : 0;
  M.bold = { w, h: M.h, a };
  return M.bold;
}
function drawMask(M, x, y, d, pal, o) {
  const rot = o && o.rot;
  let shine = -999;
  if (o && o.shine !== undefined) {
    const cyc = (o.shine + 1000) % 6;
    if (cyc < 1.3) shine = (cyc / 1.3) * ((rot ? M.h : M.w) + M.h + 8) - 6;
  }
  const w = rot ? M.h : M.w, h = rot ? M.w : M.h;
  const at = (i, j) => {
    if (rot) { const si = j, sj = M.h - 1 - i; return si >= 0 && sj >= 0 && si < M.w && sj < M.h && M.a[sj * M.w + si] === 1; }
    return i >= 0 && j >= 0 && i < M.w && j < M.h && M.a[j * M.w + i] === 1;
  };
  const sd = Math.max(1, d);
  if (pal.shadow) for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (at(i, j)) Rf(x + i * d + sd, y + j * d + sd, d, d, pal.shadow);
  if (pal.edge) for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++) {
    if (at(i, j)) continue;
    if (at(i - 1, j) || at(i + 1, j) || at(i, j - 1) || at(i, j + 1)) Rf(x + i * d, y + j * d, d, d, pal.edge);
  }
  for (let j = 0; j < h; j++) {
    const f = j / h;
    const base = f < 0.4 ? pal.hi : f < 0.75 ? pal.mid : pal.lo;
    for (let i = 0; i < w; i++) {
      if (!at(i, j)) continue;
      const up = at(i, j - 1), down = at(i, j + 1);
      let col = base;
      if (!up && down) col = pal.top; else if (up && !down) col = pal.lo;
      if (pal.shine) { const s = i - j * 0.6 - shine; if (s >= 0 && s < 2) col = pal.shine; }
      Rf(x + i * d, y + j * d, d, d, col);
    }
  }
  return { w: w * d, h: h * d };
}
/** 墨の飛沫（墨書きの題字の周り。座標ハッシュで決める） */
function spatter(x, y, w, h, col, seed) {
  for (let i = 0; i < 9; i++) {
    const px = x + hh(i, seed, 1) * w, py = y + h * (0.2 + hh(i, seed, 2) * 0.8);
    const s = hh(i, seed, 3) < 0.3 ? 2 : 1;
    if (hh(i, seed, 4) < 0.55) R(px, py, s, s, col);
  }
}

// ============================================================
// 名前の候補
// ============================================================
const NAMES = [
  { id: 'depth', en: 'DEPTHBREAKER', kana: 'デプスブレイカー', now: true,
    mean: '今の名前（比較用）。深さ（depth）を壊して進む者。', fit: '降りて殴る芯は英語 1 語で言えている。和の地下迷宮の手触りは名前から出ない。' },
  { id: 'sokougachi', k: '底穿ち', kana: 'そこうがち', sub: 'DEPTHBREAKER', rec: 1,
    mean: '底を穿つ = 地の底まで掘り抜く。今の英名をそのまま和にした形。', fit: '降りる・殴る・最深の主を越えて深みへ、が一語。英題として DEPTHBREAKER を残せる。' },
  { id: 'nenokuni', k: '根の国', kana: 'ねのくに', sub: 'NE NO KUNI', rec: 2,
    mean: '祝詞の「根の国 底の国」。地の底にある異界。', fit: '章を降りるほど異界になる構成（苔 → 寺院 → 廃城 → 深み）と神話が重なる。' },
  { id: 'bokuen', k: '墨淵', kana: 'ぼくえん', sub: 'BOKUEN', rec: 3,
    mean: '墨の淵。墨を溜めたような底なしの淵。', fit: '画面の墨・朱・金と、最深の間の墨の池にそのまま結び付く。' },
  { id: 'narakuyuki', k: '奈落行', kana: 'ならくゆき', sub: 'NARAKU YUKI', mean: '奈落へ行く。', fit: '実績「奈落の縁」・最深の主の「奈落の手」と同じ語で、世界の語として地続き。' },
  { id: 'yomotsu', k: '黄泉下り', kana: 'よもつくだり', sub: 'YOMOTSU KUDARI', mean: '黄泉（よもつ）へ下る。古語の読み。', fit: '死んでは拠点から降り直す繰り返しが、黄泉下りの題材と合う。' },
  { id: 'urushi', k: '漆ノ底', kana: 'うるしのそこ', sub: 'URUSHI NO SOKO', mean: '漆塗りの器の底。黒い漆に朱と金。', fit: 'UI の「朱と金の漆の縁」と同じ素材。' },
  { id: 'tsuzura', k: '九十九折', kana: 'つづらおり', sub: 'TSUZURAORI', mean: '幾重にも折れ曲がる坂道。', fit: '章ごとに折り返して降りていく道筋。' },

  document.querySelectorAll('[data-rec]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.rec === '1') === st.rec)));
}
function setPlan(p) {
  st.plan = p; trans = null; after = null; seed.edit = false; plan().enter(); persist(); renderNotes();
}
function update(dt) {
  time += dt;
  if (toastT > 0) toastT -= dt;
  if (after) { after.t += dt; return; }
  if (plan().update) plan().update(dt);
  if (trans) {
    trans.t += dt;
    if (trans.t >= plan().dur) {
      after = { kind: trans.kind === 'daily' ? 'depart' : st.plan === 'D' ? 'depart' : 'hub', t: 0, daily: trans.kind === 'daily' };
      trans = null;
    }
  }
}
function render() {
  begin(buf.getContext('2d'));
  cam = { z: 1, fx: 240, fy: 135, sx: 0, sy: 0 };
  fade = 0;
  R(0, 0, W, H, C.sumi);
  if (after) drawAfter(); else plan().draw();
  if (toastT > 0 && toastMsg && !after) {
    const a = clamp(toastT / 0.3, 0, 1);
    const tw = TW(toastMsg, 8) + 14;
    A(a); R(240 - tw / 2, 106, tw, 15, C.k); R(240 - tw / 2 + 1, 107, tw - 2, 13, '#1a1612'); R(240 - tw / 2 + 1, 107, tw - 2, 1, C.shu);
    T(toastMsg, 240, 109, 8, C.tx, 'center'); A(1);
  }
  const g = mainCtx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.imageSmoothingEnabled = false;
  g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height);
  const z = REDUCED.matches ? 1 : cam.z;
  const sw = (W * S) / z, sh = (H * S) / z;
  const sx = clamp(cam.fx * S - sw / 2, 0, W * S - sw), sy = clamp(cam.fy * S - sh / 2, 0, H * S - sh);
  g.drawImage(buf, sx, sy, sw, sh, cam.sx * S, cam.sy * S, cv.width, cv.height);
  if (fade > 0) { g.fillStyle = `rgba(0,0,0,${fade.toFixed(3)})`; g.fillRect(0, 0, cv.width, cv.height); }
}
let last = performance.now();
function frameTick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frameTick);
}

// ============================================================
// 入力
// ============================================================
const stage = document.getElementById('stage');
function logical(e) { const r = cv.getBoundingClientRect(); return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H }; }
function onKey(e, down) {
  const code = e.code;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(code)) e.preventDefault();
  if (!down) { if (plan().key && st.plan === 'D') plan().key(code, false); return; }
  if (e.repeat && st.plan !== 'D') { if (!code.startsWith('Arrow')) return; }
  if (after) { if (code === 'Enter' || code === 'Escape' || code === 'Space') { after = null; plan().enter(); } return; }
  if (trans) return;
  if (seed.edit) {
    if (code === 'Enter') { seed.edit = false; if (!seed.text) seed.text = seed.prev; toast('シード確定'); }
    else if (code === 'Escape') { seed.edit = false; seed.text = seed.prev; }
    else if (code === 'Backspace') { e.preventDefault(); seed.text = seed.text.slice(0, -1); }
    else if (e.key.length === 1 && /^[a-zA-Z0-9]$/.test(e.key) && seed.text.length < 16) seed.text += e.key;
    return;
  }
  if (plan().key && plan().key(code, true)) return;
  switch (code) {
    case 'KeyN': seed.edit = true; seed.prev = seed.text; break;
    case 'KeyD': startRun('daily'); break;
    case 'KeyO': activate('settings'); break;
    case 'KeyH': activate('history'); break;
    case 'KeyC': activate('codex'); break;
    case 'KeyQ': activate('quests'); break;
    case 'KeyA': activate('ach'); break;
    case 'KeyT': activate('tips'); break;
    default: break;
  }
}
stage.addEventListener('keydown', (e) => onKey(e, true));
stage.addEventListener('keyup', (e) => onKey(e, false));
stage.addEventListener('blur', () => { if (PD.keys) PD.keys.clear(); });
cv.addEventListener('pointermove', (e) => { const p = logical(e); hover = p; if (!trans && !after && plan().move) plan().move(p.x, p.y); });
cv.addEventListener('pointerdown', (e) => {
  stage.focus({ preventScroll: true });
  const p = logical(e);
  if (after) { after = null; plan().enter(); return; }
  if (trans) return;
  if (plan().down && plan().down(p.x, p.y)) { cv.setPointerCapture(e.pointerId); PB.downAt = p; return; }
  plan().click(p.x, p.y);
});
cv.addEventListener('pointerup', (e) => {
  if (plan().up) {
    const p = logical(e);
    const moved = PB.downAt && Math.abs(p.x - PB.downAt.x) > 3;
    plan().up();
    if (PB.downAt && !moved && st.plan === 'B') plan().click(p.x, p.y);
    PB.downAt = null;
  }
});
cv.addEventListener('wheel', (e) => { if (plan().wheel) { e.preventDefault(); plan().wheel(e.deltaY); } }, { passive: false });
cv.addEventListener('contextmenu', (e) => e.preventDefault());

// ============================================================
// 操作盤
// ============================================================
const namesEl = document.getElementById('names');
NAMES.forEach((n, i) => {
  const b = document.createElement('button');
  b.className = 'btn';
  b.dataset.name = String(i);
  b.innerHTML = (n.k || n.en) + (n.rec ? `<span class="rec"> ★</span>` : '') + (n.now ? '（今）' : '');
  b.title = `${n.kana}${n.sub ? ' / ' + n.sub : ''}`;
  b.addEventListener('click', () => { st.name = i; persist(); renderNotes(); stage.focus({ preventScroll: true }); });
  namesEl.appendChild(b);
});
document.querySelectorAll('[data-plan]').forEach((b) => b.addEventListener('click', () => { setPlan(b.dataset.plan); try { history.replaceState(null, '', '#' + b.dataset.plan); } catch (e) { /* 無視 */ } stage.focus({ preventScroll: true }); }));
document.querySelectorAll('[data-style]').forEach((b) => b.addEventListener('click', () => { st.style = b.dataset.style; persist(); renderNotes(); stage.focus({ preventScroll: true }); }));
document.querySelectorAll('[data-rec]').forEach((b) => b.addEventListener('click', () => { st.rec = b.dataset.rec === '1'; layers.clear(); persist(); setPlan(st.plan); stage.focus({ preventScroll: true }); }));
document.getElementById('btnRestart').addEventListener('click', () => { setPlan(st.plan); stage.focus({ preventScroll: true }); });

// 整数倍に拡大（幅が 480 に満たないときだけ縮める）。裏画面の倍率は表示の実ピクセルに合わせて 2〜4
function fit() {
  const wrap = document.querySelector('.wrap');
  const avail = Math.min(wrap.clientWidth - 34, window.innerWidth - 34);
  const k = avail >= 480 ? Math.max(1, Math.min(3, Math.floor(avail / 480))) : avail / 480;
  const cssW = Math.floor(480 * k);
  cv.style.width = cssW + 'px';
  cv.style.height = Math.floor(270 * k) + 'px';
  const dpr = window.devicePixelRatio || 1;
  const want = clamp(Math.ceil((cssW * dpr) / 480), 2, 4);
  if (want !== S || cv.width !== W * want) {
    S = want;
    cv.width = W * S; cv.height = H * S; buf.width = W * S; buf.height = H * S;
    layers.clear(); textCache.clear();
  }
  cv.classList.toggle('smooth', cssW * dpr < W * S);
}
window.addEventListener('resize', fit);
fit();
function fontsReady() { maskCache.clear(); textCache.clear(); layers.clear(); }
if (document.fonts) {
  const all = NAMES.map((n) => n.k || n.en).join('') + '苔の洞起点地下一階';
  Promise.all([document.fonts.load(`16px ${DOT}`, 'あ漢A' + all), document.fonts.load(`30px ${BRUSH}`, all)]).then(fontsReady, fontsReady);
  document.fonts.ready.then(fontsReady);
}
setPlan(st.plan);
stage.focus({ preventScroll: true });
requestAnimationFrame(frameTick);
</script>
</body>
